<svg width="440" height="120" viewBox="0 0 440 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embarko">
  <title>Embarko</title>

  <!-- ================= MARK ================= -->
  <g transform="translate(8 8)">
    <!-- rounded square badge -->
    <rect x="0" y="0" width="104" height="104" rx="26" fill="#111111"/>

    <!-- ship's wheel (helm) -->
    <g transform="translate(52 46)" stroke="#ff4d00" stroke-width="5" stroke-linecap="round" fill="none">
      <circle cx="0" cy="0" r="20"/>
      <circle cx="0" cy="0" r="7.5" fill="#ff4d00" stroke="none"/>
      <!-- spokes + handles -->
      <g>
        <line x1="0" y1="-20" x2="0" y2="-31"/>
        <line x1="0" y1="20"  x2="0" y2="31"/>
        <line x1="-20" y1="0" x2="-31" y2="0"/>
        <line x1="20" y1="0"  x2="31" y2="0"/>
        <line x1="-14.1" y1="-14.1" x2="-21.9" y2="-21.9"/>
        <line x1="14.1" y1="-14.1"  x2="21.9" y2="-21.9"/>
        <line x1="-14.1" y1="14.1"  x2="-21.9" y2="21.9"/>
        <line x1="14.1" y1="14.1"   x2="21.9" y2="21.9"/>
      </g>
    </g>

    <!-- waves under the wheel -->
    <path d="M14 84 q9 -8 18 0 t18 0 t18 0 t18 0"
          stroke="#ff4d00" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <text x="128" y="72"
        font-family="'Poppins','Segoe UI',Arial,sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1"
        fill="#111111">Embark<tspan fill="#ff4d00">o</tspan></text>
</svg>
