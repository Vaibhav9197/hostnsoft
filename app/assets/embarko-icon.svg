<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Embarko icon">
  <title>Embarko</title>
  <rect x="0" y="0" width="120" height="120" rx="30" fill="#111111"/>

  <!-- ship's wheel (helm) -->
  <g transform="translate(60 52)" stroke="#ff4d00" stroke-width="5.5" stroke-linecap="round" fill="none">
    <circle cx="0" cy="0" r="23"/>
    <circle cx="0" cy="0" r="8.5" fill="#ff4d00" stroke="none"/>
    <g>
      <line x1="0" y1="-23" x2="0" y2="-35"/>
      <line x1="0" y1="23"  x2="0" y2="35"/>
      <line x1="-23" y1="0" x2="-35" y2="0"/>
      <line x1="23" y1="0"  x2="35" y2="0"/>
      <line x1="-16.3" y1="-16.3" x2="-24.7" y2="-24.7"/>
      <line x1="16.3" y1="-16.3"  x2="24.7" y2="-24.7"/>
      <line x1="-16.3" y1="16.3"  x2="-24.7" y2="24.7"/>
      <line x1="16.3" y1="16.3"   x2="24.7" y2="24.7"/>
    </g>
  </g>

  <!-- waves -->
  <path d="M18 96 q10.5 -9 21 0 t21 0 t21 0"
        stroke="#ff4d00" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
